<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fisher Link — Pêche Port-Gentil</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ---------- Écran de connexion ---------- -->
<div id="login" class="login">
  <div class="login-card">
    <img class="logo" src="/logo.svg" alt="Fisher Link" width="72" height="72">
    <h1 class="fr">Fisher Link</h1>
    <p class="sub">Journal de bord · Pêche artisanale · Port-Gentil</p>
    <label for="usr">Identifiant</label>
    <input id="usr" type="text" autocomplete="username" placeholder="admin ou pecheur">
    <label for="pw">Mot de passe</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="••••••">
    <button id="loginBtn">Entrer</button>
    <p id="loginErr" class="err" hidden></p>
  </div>
</div>

<!-- ---------- Application ---------- -->
<div id="app" hidden>
  <div class="shell">
    <header class="head">
      <div class="head-l">
        <img class="logo-sm" src="/logo.svg" alt="Fisher Link" width="38" height="38">
        <div>
          <h1 class="fr" id="hTitle">Fisher Link</h1>
          <p class="muted" id="hBoat">Pirogue · Port‑Gentil</p>
        </div>
      </div>
      <div class="head-r">
        <div class="muted num" id="hWeek"></div>
        <div class="nemo" id="hNemo"><span class="dot"></span><span id="nemoTxt">NEMO —</span></div>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="journal">Journal</button>
      <button class="tab" data-tab="carte">Carte &amp; carburant</button>
      <button class="tab" data-tab="controle">Contrôle</button>
      <button class="tab" data-tab="depenses">Dépenses</button>
      <button class="tab" data-tab="bilan">Bilan</button>
      <button class="tab" data-tab="saisie">Nouvelle sortie</button>
      <button class="tab" data-tab="reglages">Réglages</button>
    </nav>

    <main id="view"></main>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/map.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
