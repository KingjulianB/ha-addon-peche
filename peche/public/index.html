<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fisher Link — Pêche Port-Gentil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,380;9..144,460;9..144,560&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ---------- Écran de connexion ---------- -->
<div id="login" class="login">
  <div class="login-card">
    <svg class="logo" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M24 6 C24 6 12 10 12 22 C12 30 18 34 24 40 C30 34 36 30 36 22 C36 10 24 6 24 6 Z" fill="none" stroke="currentColor" stroke-width="2.2" opacity="0.28"/>
      <path d="M17 20 C17 15 21 13 24 13 C27 13 30 15 30 19 C30 23 26 24 24 26 C22 28 22 30 24 31" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="24" cy="34" r="1.8" fill="currentColor"/>
      <path d="M14 24 C10 24 9 21 11 19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
    <h1 class="fr">Fisher Link</h1>
    <p class="sub">Journal de bord · Pêche artisanale · Port-Gentil</p>
    <label for="usr">Identifiant</label>
    <input id="usr" type="text" autocomplete="username" placeholder="admin ou pecheur">
    <label for="pw">Mot de passe</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="••••••">
    <button id="loginBtn">Entrer</button>
    <p id="loginErr" class="err" hidden></p>
  </div>
</div>

<!-- ---------- Application ---------- -->
<div id="app" hidden>
  <div class="shell">
    <header class="head">
      <div class="head-l">
        <svg class="logo-sm" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M24 6 C24 6 12 10 12 22 C12 30 18 34 24 40 C30 34 36 30 36 22 C36 10 24 6 24 6 Z" fill="none" stroke="currentColor" stroke-width="2.2" opacity="0.28"/>
          <path d="M17 20 C17 15 21 13 24 13 C27 13 30 15 30 19 C30 23 26 24 24 26 C22 28 22 30 24 31" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          <circle cx="24" cy="34" r="1.8" fill="currentColor"/>
          <path d="M14 24 C10 24 9 21 11 19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <div>
          <h1 class="fr" id="hTitle">Fisher Link</h1>
          <p class="muted" id="hBoat">Pirogue · Port‑Gentil</p>
        </div>
      </div>
      <div class="head-r">
        <div class="muted num" id="hWeek"></div>
        <div class="nemo" id="hNemo"><span class="dot"></span><span id="nemoTxt">NEMO —</span></div>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="journal">Journal</button>
      <button class="tab" data-tab="carte">Carte &amp; carburant</button>
      <button class="tab" data-tab="controle">Contrôle</button>
      <button class="tab" data-tab="saisie">Nouvelle sortie</button>
      <button class="tab" data-tab="reglages">Réglages</button>
    </nav>

    <main id="view"></main>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/map.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
